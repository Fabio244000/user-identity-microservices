name: Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Salvaguarda: si algo se cuelga de forma inesperada, el job se corta acá
    # en vez de seguir corriendo en silencio hasta el límite de GitHub Actions
    # (6h) o hasta que las credenciales OIDC expiren (~1h).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deploy dependencies
        run: npm ci

      # Necesario para que dockerizePip pueda compilar las dependencias para
      # arm64 (Graviton2) en un runner de GitHub Actions, que es x86_64.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
        run: npx serverless deploy --stage dev
