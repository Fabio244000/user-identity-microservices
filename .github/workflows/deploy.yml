name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage a desplegar'
        required: false
        default: 'dev'
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Salvaguarda: si algo se cuelga de forma inesperada, el job se corta acá
    # en vez de seguir corriendo en silencio hasta el límite de GitHub Actions
    # (6h) o hasta que las credenciales OIDC expiren (~1h).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deploy dependencies
        run: npm ci

      # Necesario para que dockerizePip pueda compilar las dependencias para
      # arm64 (Graviton2) en un runner de GitHub Actions, que es x86_64.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # Paso temporal de diagnóstico — borrar una vez resuelto el error de
      # OIDC. Decodifica el token real que GitHub le manda a AWS para
      # comparar sub/aud contra la política de confianza del rol, en vez de
      # adivinar. No imprime nada secreto, solo los claims del token.
      - name: Debug OIDC token claims
        run: |
          IDTOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys, json; print(json.load(sys.stdin)['value'])")
          python3 -c "
          import sys, json, base64
          token = sys.argv[1]
          payload = token.split('.')[1]
          padded = payload + '=' * (-len(payload) % 4)
          print(json.dumps(json.loads(base64.urlsafe_b64decode(padded)), indent=2))
          " "$IDTOKEN"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }} # TODO: access key de Serverless Dashboard (Parte B), no es un secreto de AWS
        run: npx serverless deploy --stage ${{ inputs.stage || 'dev' }} --debug

      # Captura el detalle real de validación de CloudFormation (el que no
      # trae el DescribeStackEvents clásico que usa Serverless Framework)
      # apenas falla el deploy, antes de que el stack se autoelimine
      # (onFailure: DELETE) y se pierda la posibilidad de verlo a mano.
      - name: Show CloudFormation validation details on failure
        if: failure()
        run: aws cloudformation describe-events --stack-name user-identity-${{ inputs.stage || 'dev' }} --region us-east-1
